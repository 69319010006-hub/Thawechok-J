<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Login</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- เชื่อมต่อไฟล์ CSS จากโฟลเดอร์ src/css/ -->
    <link rel="stylesheet" href="../src/css/style.css">
</head>
<body>

    <main class="login-container">
        <!-- Left Branding Section -->
        <section class="brand-section">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                Enterprise App
            </div>
            <h1 class="brand-title">Welcome back to your workspace.</h1>
            <p class="brand-subtitle">Manage your enterprise data securely and efficiently with our modern dashboard ecosystem.</p>
        </section>

        <!-- Right Form Section -->
        <section class="form-section">
            <div class="form-wrapper">
                <header class="form-header">
                    <h2>Sign in</h2>
                    <p>Please enter your credentials to access your account.</p>
                </header>

                <form id="loginForm" novalidate>
                    <!-- Email Input -->
                    <div class="input-group">
                        <input type="email" id="email" class="input-field" placeholder="Email address" required aria-label="Email address" autocomplete="email">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <input type="password" id="password" class="input-field" placeholder="Password" required aria-label="Password" autocomplete="current-password">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            <svg id="eyeIcon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                    
                    <div id="authError" class="error-message">Invalid email or password. Please try again.</div>

                    <div class="form-options">
                        <label class="checkbox-group">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary" id="loginBtn">
                        <span class="btn-text">Sign In</span>
                        <div class="spinner"></div>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- เชื่อมต่อไฟล์ JS จากโฟลเดอร์ src/js/ -->
    <script src="../src/js/app.js"></script>
</body>
</html>
